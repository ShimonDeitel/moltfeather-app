name: MoltAndFeather
options:
  bundleIdPrefix: com.shimondeitel.moltfeather
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  MoltAndFeather:
    type: application
    platform: iOS
    sources:
      - path: MoltAndFeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.moltfeather
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MoltAndFeather/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  MoltAndFeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoltAndFeatherTests
      - path: MoltAndFeather.storekit
    dependencies:
      - target: MoltAndFeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.moltfeather.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  MoltAndFeatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoltAndFeatherUITests
    dependencies:
      - target: MoltAndFeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.moltfeather.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  MoltAndFeather:
    build:
      targets:
        MoltAndFeather: all
        MoltAndFeatherTests: [test]
        MoltAndFeatherUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: MoltAndFeather.storekit
    test:
      config: Debug
      storeKitConfiguration: MoltAndFeather.storekit
      targets:
        - MoltAndFeatherTests
        - MoltAndFeatherUITests
    archive:
      config: Release
